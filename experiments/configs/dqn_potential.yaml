algo: dqn
total_steps: 250000        # reduced-scale run; see README "Compute budget"
n_envs: 1
async_envs: false
frame_stack: 4
curriculum: false          # off so each ablation arm varies exactly one thing

env:
  action_mode: discrete
  map_rows: 12
  map_cols: 12
  cell_size: 0.5
  n_rays: 24
  max_steps: 250
  goal_radius: 0.25
  min_separation: 2.0
  obstacle_density: 0.12

reward:
  shaping: potential
  goal: 10.0
  collision: -10.0
  step: -0.01
  clearance_penalty: -0.05
  clearance_threshold: 0.3
  jerk_penalty: -0.01
  gamma: 0.99

lidar:
  n_rays: 24
  noise_std: 0.01
  dropout: 0.02

dqn:
  lr: 0.0003
  gamma: 0.99
  buffer_size: 200000
  batch_size: 128
  learning_starts: 2000
  train_freq: 4
  target_update_interval: 1000
  eps_start: 1.0
  eps_end: 0.05
  eps_decay_steps: 40000
